<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Centralized Team Hub</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:#f8fafc;color:#0f172a}
.hub{max-width:1000px;margin:0 auto;min-height:100vh;border:1px solid #e2e8f0}
nav{background:#0f1e3d;padding:10px 16px;display:flex;gap:6px;align-items:center}
nav b{color:#fff;margin-right:12px}
nav button{background:none;border:0;color:rgba(255,255,255,.6);padding:6px 10px;border-radius:8px;font-weight:600;font-size:12px;cursor:pointer}
nav button.on{color:#fff;background:rgba(255,255,255,.15)}
.hd{background:linear-gradient(135deg,#0f1e3d,#1a2f55);color:#fff;padding:24px 28px}
.hd h1{font-size:20px}.hd p{font-size:13px;color:rgba(255,255,255,.65);margin-top:4px}
.ct{padding:20px 28px}
.g{background:#fff;border:1.5px solid #e2e8f0;border-radius:14px;margin-bottom:10px;overflow:hidden}
.gh{padding:14px 16px;cursor:pointer}
.gt{font-size:14px;font-weight:800;margin-bottom:10px;display:flex;justify-content:space-between}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.k{border:1.5px solid #e2e8f0;border-radius:12px;padding:10px 12px}
.k.ok{border-color:#bbf7d0}.k.bad{border-color:#fecaca}
.k .l{font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase}
.k .s{font-size:20px;font-weight:800}.k.ok .s{color:#15803d}.k.bad .s{color:#dc2626}
.k .s small{font-size:11px;color:#64748b;font-weight:400;margin-left:4px}
.bar{height:5px;background:#f1f5f9;border-radius:6px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%}
.det{border-top:1px solid #e2e8f0;padding:12px 16px;overflow-x:auto}
.lbl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#64748b;margin:10px 0 6px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{color:#64748b;font-size:10px;text-align:right;padding:6px 8px;background:#f8fafc}
td{padding:6px 8px;text-align:right;border-top:1px solid #f1f5f9}
th:first-child,td:first-child{text-align:left}
td.ok{color:#15803d;font-weight:700}td.bad{color:#dc2626;font-weight:700}
.warn{background:#fef3c7;border:1px solid #fde68a;color:#92400e;border-radius:8px;padding:8px 12px;font-size:11px;margin-bottom:12px}
.note{font-size:11px;color:#64748b}
.btn{padding:8px 16px;background:#3b82f6;color:#fff;border:0;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;margin-bottom:14px}
@media(max-width:640px){.row{grid-template-columns:1fr}.ct{padding:14px}}
@media print{nav,.noprint{display:none}}
</style></head><body><div class="hub">
<nav><b>🏢 Centralized Hub</b><button id="n-sc" onclick="go('sc')">📊 Scorecard</button><button id="n-wk" onclick="go('wk')">📧 Weekly Glance</button></nav>
<div id="app"></div></div>
<script>
// Paste your NEW Firebase web config here (Project settings > General > Your apps).
const FIREBASE_CONFIG = {apiKey:"AIzaSyAudBX5bP_lyoD28FfAeY12hl1IWrdhnxE",authDomain:"centralized-hub.firebaseapp.com",projectId:"centralized-hub",appId:"1:317300945151:web:fd29964374e6f3f836dcca"}
const KPIS=[
 {id:'call_completion',label:'Phone · Call Completion',goal:90,u:'%'},
 {id:'task_management',label:'Agent Score · Task Mgmt',goal:9,u:''},
 {id:'fenix',label:'Insights · Scored Convos',goal:90,u:'%'}];
const ORDER=[['pod1','POD 1 · CO Springs + UT'],['pod2','POD 2 · AZ'],['pod3','POD 3 · KS/MO/TN + FL'],['denver','Denver'],['aa','AA · Application Admin']];
const MGR={pod1:'Camdem',pod2:'Candace',pod3:'Edwin',denver:'Maritza',aa:'Lauren'};
let S={page:'sc',open:{},data:{},live:false};
const ok=(v,g)=>v!=null&&v>=g;
function demo(){let n=11;const r=()=>(n=(n*9301+49297)%233280)/233280;const o={};
 ORDER.forEach(([id,name])=>{const ag=['Agent A','Agent B','Agent C'].map(a=>({name:a,task_management:+(8+r()*2).toFixed(1),fenix:+(80+r()*18).toFixed(1),calls:Math.round(10+r()*40)}));
  o[id]={name,reportDate:'sample',team:{call_completion:+(80+r()*18).toFixed(1),task_management:+(8+r()*2).toFixed(1),fenix:+(80+r()*18).toFixed(1)},agents:ag,communities:[{name:'Community 1',fenix:88,calls:20},{name:'Community 2',fenix:93,calls:15}]}});return o}
function init(){S.data=demo();render();
 if(FIREBASE_CONFIG){try{firebase.initializeApp(FIREBASE_CONFIG);firebase.firestore().collection('groups').onSnapshot(q=>{const d={};q.forEach(x=>d[x.id]=x.data());if(Object.keys(d).length){S.data=d;S.live=true;render()}})}catch(e){console.error(e)}}}
function go(p){S.page=p;render()}
function card(k,v){const has=v!=null,good=ok(v,k.goal);
 return `<div class="k ${has?(good?'ok':'bad'):''}"><div class="l">${k.label}</div><div class="s">${has?v+k.u:'—'}<small>/ ${k.goal}${k.u}</small></div>${has?`<div class="bar"><i style="width:${Math.min(100,v/k.goal*100)}%;background:${good?'#16a34a':'#e05c45'}"></i></div>`:''}</div>`}
function cell(v,g,u){return `<td class="${v==null?'':ok(v,g)?'ok':'bad'}">${v==null?'–':v+u}</td>`}
function detail(d){const ag=[...(d.agents||[])].sort((a,b)=>(b.fenix||0)-(a.fenix||0));
 return `<div class="det"><div class="lbl">Agents</div><table><tr><th>Agent</th><th>Task Mgmt</th><th>Scored Convos</th><th>Calls</th></tr>${ag.map(a=>`<tr><td>${a.name}</td>${cell(a.task_management,9,'')}${cell(a.fenix,90,'%')}<td>${a.calls??'–'}</td></tr>`).join('')||'<tr><td>No agents yet</td></tr>'}</table>
 ${(d.communities||[]).length?`<div class="lbl">Communities (scored conversations)</div><table><tr><th>Community</th><th>Score</th><th>Calls</th></tr>${d.communities.sort((a,b)=>a.fenix-b.fenix).map(c=>`<tr><td>${c.name}</td>${cell(c.fenix,90,'%')}<td>${c.calls}</td></tr>`).join('')}</table>`:''}
 ${(d.warnings||[]).length?`<div class="note" style="margin-top:8px">⚠ ${d.warnings.join(' · ')}</div>`:''}</div>`}
function scorecard(){const first=Object.values(S.data)[0]||{};
 return `<div class="hd"><h1>📊 Scorecard</h1><p>Latest daily report by POD${S.live&&first.reportDate?' · '+first.reportDate:''}</p></div><div class="ct">
 ${!S.live?'<div class="warn">Showing sample data. Add your Firebase config in index.html to see live scores.</div>':''}
 ${ORDER.map(([id,name])=>{const d=S.data[id];if(!d)return `<div class="g"><div class="gh"><div class="gt"><span>${name} <span class="note" style="font-weight:600">· Manager: ${MGR[id]}</span></span><span class="note">No data yet</span></div></div></div>`;
  return `<div class="g"><div class="gh" onclick="S.open['${id}']=!S.open['${id}'];render()"><div class="gt"><span>${name} <span class="note" style="font-weight:600">· Manager: ${MGR[id]}</span></span><span class="note">${S.open[id]?'▲':'▼'}</span></div><div class="row">${KPIS.map(k=>card(k,d.team?.[k.id])).join('')}</div></div>${S.open[id]?detail(d):''}</div>`}).join('')}</div>`}
function weekly(){const all=ORDER.map(([id,n])=>S.data[id]&&{n,m:MGR[id],t:S.data[id].team||{}}).filter(Boolean);
 const avg=k=>{const v=all.map(x=>x.t[k]).filter(x=>x!=null);return v.length?+(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):null};
 return `<div class="hd"><h1>📧 Weekly At-a-Glance</h1><p>${new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}</p></div><div class="ct">
 <button class="btn noprint" onclick="print()">🖨 Print / Save PDF</button>
 <div class="row" style="margin-bottom:14px">${KPIS.map(k=>card({...k,label:'All groups · '+k.label},avg(k.id))).join('')}</div>
 <div class="g" style="padding:0;overflow-x:auto"><table><tr><th>Group</th>${KPIS.map(k=>`<th>${k.label}</th>`).join('')}</tr>${all.map(x=>`<tr><td>${x.n} <span class="note">· ${x.m}</span></td>${KPIS.map(k=>cell(x.t[k.id],k.goal,k.u)).join('')}</tr>`).join('')}</table></div></div>`}
function render(){document.getElementById('app').innerHTML=S.page==='sc'?scorecard():weekly();
 ['sc','wk'].forEach(k=>document.getElementById('n-'+k).classList.toggle('on',S.page===k))}
init();
</script></body></html>
